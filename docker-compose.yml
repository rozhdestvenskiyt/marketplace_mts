services:
  postgres:
    image: postgres:16-alpine
    container_name: avito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: avito
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
