spring.application.name=avito

spring.datasource.url=jdbc:postgresql://localhost:5432/avito
spring.datasource.username=avito
spring.datasource.password=avito

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
app.elasticsearch.index=${ELASTICSEARCH_INDEX:listings}
app.elasticsearch.reindex-on-startup=${ELASTICSEARCH_REINDEX_ON_STARTUP:false}
