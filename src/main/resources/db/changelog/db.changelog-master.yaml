databaseChangeLog:
  - changeSet:
      id: 1-create-marketplace-tables
      author: copilot
      changes:
        - sql:
            sql: |
              CREATE TABLE users (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  email VARCHAR(255) NOT NULL UNIQUE,
                  password_hash VARCHAR(255) NOT NULL,
                  username VARCHAR(100) NOT NULL UNIQUE,
                  full_name VARCHAR(255),
                  is_verified BOOLEAN NOT NULL DEFAULT FALSE,
                  created_at TIMESTAMPTZ NOT NULL
              );

              CREATE TABLE listings (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  user_id BIGINT NOT NULL REFERENCES users(id),
                  title VARCHAR(255) NOT NULL,
                  description TEXT NOT NULL,
                  price NUMERIC(12, 2) NOT NULL,
                  category VARCHAR(255),
                  tags TEXT[],
                  photos TEXT[],
                  created_at TIMESTAMPTZ NOT NULL
              );

              CREATE TABLE dialogs (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  listing_id BIGINT NOT NULL REFERENCES listings(id),
                  buyer_id BIGINT NOT NULL REFERENCES users(id),
                  seller_id BIGINT NOT NULL REFERENCES users(id),
                  created_at TIMESTAMPTZ NOT NULL
              );

              CREATE TABLE messages (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  dialog_id BIGINT NOT NULL REFERENCES dialogs(id),
                  sender_id BIGINT NOT NULL REFERENCES users(id),
                  content TEXT NOT NULL,
                  created_at TIMESTAMPTZ NOT NULL
              );
  - changeSet:
      id: 2-add-registration-verification
      author: copilot
      changes:
        - sql:
            sql: |
              ALTER TABLE users
                  ADD COLUMN phone VARCHAR(16),
                  ADD COLUMN email_verified BOOLEAN NOT NULL DEFAULT FALSE,
                  ADD COLUMN phone_verified BOOLEAN NOT NULL DEFAULT FALSE,
                  ADD COLUMN terms_accepted_at TIMESTAMPTZ;

              UPDATE users
              SET email_verified = is_verified,
                  phone_verified = is_verified;

              CREATE UNIQUE INDEX uq_users_phone
                  ON users(phone)
                  WHERE phone IS NOT NULL;

              CREATE TABLE verification_codes (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  channel VARCHAR(10) NOT NULL CHECK (channel IN ('EMAIL', 'SMS')),
                  code_hash VARCHAR(100) NOT NULL,
                  created_at TIMESTAMPTZ NOT NULL,
                  expires_at TIMESTAMPTZ NOT NULL,
                  attempts INTEGER NOT NULL DEFAULT 0 CHECK (attempts >= 0),
                  consumed_at TIMESTAMPTZ
              );

              CREATE INDEX ix_verification_codes_active
                  ON verification_codes(user_id, channel, created_at DESC)
                  WHERE consumed_at IS NULL;
  - changeSet:
      id: 3-create-listing-reviews
      author: copilot
      changes:
        - sql:
            sql: |
              CREATE TABLE reviews (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  listing_id BIGINT NOT NULL REFERENCES listings(id) ON DELETE CASCADE,
                  author_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  rating INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5),
                  comment VARCHAR(2000) NOT NULL CHECK (length(trim(comment)) > 0),
                  created_at TIMESTAMPTZ NOT NULL,
                  CONSTRAINT uq_reviews_listing_author UNIQUE (listing_id, author_id)
              );

              CREATE INDEX ix_reviews_listing_created
                  ON reviews(listing_id, created_at DESC, id DESC);
